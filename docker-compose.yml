name: widetv

services:
  widetv:
    build:
      context: .
      target: runtime
    image: widetv:latest
    container_name: widetv
    restart: unless-stopped
    # PID 1 que enterra processo zumbi do ffprobe.
    init: true

    # Segredos vem do .env ao lado deste arquivo, entregues literais ao
    # container. Importante: o hash da senha contem "$" e NAO pode passar por
    # interpolacao do compose. No .env, escreva entre aspas simples:
    #   AUTH_PASSWORD_HASH='scrypt$16384$8$1$...'
    # required: false porque no TrueNAS as variaveis vem da UI, sem .env.
    env_file:
      - path: .env
        required: false

    # Estas tres sobrescrevem o .env de proposito: no .env elas descrevem o
    # HOST (onde fica a biblioteca, onde fica o banco), aqui descrevem o
    # caminho DENTRO do container. `environment` tem prioridade sobre env_file.
    environment:
      PORT: "8080"
      LIBRARY_ROOT: /media/biblioteca
      DATA_DIR: /data
      # Primeiro boot indexa o acervo sozinho, em segundo plano. Ponha "false"
      # se preferir controlar o scan na mao com:
      #   docker compose exec widetv node dist/server/scan.js /media/biblioteca
      AUTO_SCAN: "true"
      # Rescan diario no horario LOCAL (a TZ abaixo manda): adiciona series e
      # episodios novos e remove os que sairam do disco. "off" desliga.
      RESCAN_TIME: "04:00"
      # Converte MKV/Dolby para MP4 em segundo plano (copia de bytes, sem
      # transcode). As copias ficam no volume de DATA_DIR e ocupam mais ou
      # menos o tamanho dos proprios MKV; "false" desliga.
      AUTO_REMUX: "true"
      # Opcional: melhora as capas e traz sinopse em pt-BR. Sem ela o servidor
      # usa TVMaze e iTunes, que nao pedem chave.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TZ: ${TZ:-America/Sao_Paulo}

    # Publicado so no loopback: sem HTTPS na frente, o cookie de sessao anda em
    # texto claro pela rede. Troque HOST_BIND para 0.0.0.0 apenas se o reverse
    # proxy estiver em outra maquina - e ai coloque HTTPS nele.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"

    volumes:
      # Biblioteca read-only: o app so le e nunca renomeia nada do acervo.
      - "${LIBRARY_ROOT:?defina LIBRARY_ROOT no .env com o caminho da biblioteca no host}:/media/biblioteca:ro"
      # Indice SQLite, capas e legendas em volume nomeado: sobrevivem a
      # recriacao do container.
      - widetv-data:/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # 401 conta como saudavel: prova que o processo responde antes do login.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/api/auth/session').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  widetv-data:
