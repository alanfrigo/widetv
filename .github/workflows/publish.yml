name: Publish image

# Reconstroi a imagem quando o codigo muda e quando sai uma tag de versao.
# O build local depende da maquina de quem roda; este nao.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sem isto o GITHUB_TOKEN nao consegue escrever no GHCR.
      packages: write
      # Necessaria para o attestation de proveniencia abaixo.
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Rodar a suite antes de publicar
        # Publicar imagem quebrada e pior do que nao publicar.
        run: |
          npm ci
          npm run typecheck
          npm test

      # QEMU so e necessario para o stage amd64/arm64 que nao for nativo do
      # runner. better-sqlite3 compila dentro do stage certo, entao a emulacao
      # aqui e correta, ainda que lenta.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Transforma uma pasta de desenhos animados em canais de TV ao vivo

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attestation de proveniencia
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
